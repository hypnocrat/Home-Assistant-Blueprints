blueprint:
  name: Reset Manual Overrides
  description: >
    Toggle selected input_boolean entities to OFF at a configurable offset from sunset
    and when Home Assistant restarts or resets.
  domain: automation
  input:
    target_booleans:
      name: Input Booleans to Toggle
      description: Select one or more input_boolean entities to toggle.
      selector:
        entity:
          domain: input_boolean
          multiple: true
    sunset_offset:
      name: Sunset Offset
      description: Offset from sunset in format 'HH:MM' (e.g., '01:00' or '-00:30')
      default: "-01:00"
      selector:
        text:

mode: single

trigger:
  - platform: sun
    event: sunset
    offset: !input sunset_offset
  - platform: homeassistant
    event: start

action:
  - service: input_boolean.turn_off
    target:
      entity_id: !input target_booleans
