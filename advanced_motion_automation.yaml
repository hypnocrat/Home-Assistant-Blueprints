blueprint:
  name: Motion-activated Light with Automatic Manual Override
  description: Turn on lights when motion is detected. If the light is controlled manually, a manual override is automatically enabled to prevent the automation from interfering. Includes separate sunrise/sunset offsets and other conditions.
  domain: automation
  input:
    motion_sensors:
      name: Motion and Occupancy Sensors
      description: Select one or more motion or occupancy sensors.
      selector:
        entity:
          domain: binary_sensor
          device_class:
            - motion
            - occupancy
          multiple: true
    entity_target:
      name: Lights and Switches
      description: Select one or more lights or switches to control.
      selector:
        target:
          entity:
            domain:
              - light
              - switch
    no_motion_wait:
      name: Wait Time
      description: Time to leave the light on after last motion is detected.
      default: 60
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
    use_custom_settings:
      name: Use Custom Brightness and Color
      description: Enable to use custom brightness and color settings.
      default: false
      selector:
        boolean:
    brightness:
      name: Brightness
      description: Set the brightness level (0-255).
      default: 255
      selector:
        number:
          min: 0
          max: 255
    color:
      name: Color
      description: Set the color (in RGB format).
      default: [255, 255, 255]
      selector:
        color_rgb:
    condition_entity:
      name: Condition Entity (Optional)
      description: Select an entity to check its state (optional). If no entity is defined, this condition is not evaluated.
      default:
      selector:
        entity:
    condition_states:
      name: Allowed States for Condition Entity
      description: Enter the states that the condition entity should be in (comma-separated). If a Condition Entity is not defined these values are ignored.
      default:
      selector:
        text:
    sun_condition:
      name: Sun Condition (Optional)
      description: Select the sun condition to check.
      default: night
      selector:
        select:
          options:
            - none
            - day
            - night
    sunrise_offset:
      name: Sunrise Offset (Optional)
      description: Offset from sunrise in format 'HH:MM' (e.g., '01:00' or '-00:30')
      default: "01:00"
      selector:
        text:
    sunset_offset:
      name: Sunset Offset (Optional)
      description: Offset from sunset in format 'HH:MM' (e.g., '01:00' or '-00:30')
      default: "-01:00"
      selector:
        text:
    blocking_entity:
      name: Blocking Entity (Optional)
      description: Select an entity that will prevent the automation from running when in specified states.
      default:
      selector:
        entity:
    blocking_states:
      name: Blocking States
      description: Enter the states that will prevent the automation from running (comma-separated).
      default:
      selector:
        text:
    manual_override_helper:
      name: Manual Override Helper
      description: Select an input_boolean helper. This will be automatically turned on when the light is controlled manually to disable automation control.
      default:
      selector:
        entity:
          domain: input_boolean
    manual_override_reset_time:
      name: Manual Override Reset Time
      description: Time to reset the manual override after it has been activated.
      default: 300
      selector:
        number:
          min: 60
          max: 3600
          unit_of_measurement: seconds

mode: restart
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input motion_sensors
    to: "on"
    id: motion_trigger

variables:
  use_custom_settings: !input use_custom_settings
  condition_entity: !input condition_entity
  condition_states: !input condition_states
  sun_condition: !input sun_condition
  sunrise_offset: !input sunrise_offset
  sunset_offset: !input sunset_offset
  blocking_entity: !input blocking_entity
  blocking_states: !input blocking_states
  manual_override_helper: !input manual_override_helper
  entity_target: !input entity_target
  manual_override_reset_time: !input manual_override_reset_time

condition:
  - condition: state
    entity_id: !input manual_override_helper
    state: "off"
  - condition: or
    conditions:
      - condition: template
        value_template: "{{ blocking_entity == None or blocking_entity == '' }}"
      - condition: template
        value_template: >
          {% set blocking_states_list = blocking_states.split(',') | map('trim') | list %}
          {{ states(blocking_entity) not in blocking_states_list }}
  - condition: or
    conditions:
      - condition: template
        value_template: "{{ condition_entity == None or condition_entity == '' }}"
      - condition: template
        value_template: >
          {% set states_list = condition_states.split(',') | map('trim') | list %}
          {{ condition_entity != None and condition_entity != '' and states_list | length > 0 and states(condition_entity) in states_list }}
  - condition: or
    conditions:
      - condition: template
        value_template: "{{ sun_condition == 'none' }}"
      - condition: and
        conditions:
          - condition: template
            value_template: "{{ sun_condition == 'day' }}"
          - condition: sun
            after: sunrise
            after_offset: !input sunrise_offset
            before: sunset
            before_offset: !input sunset_offset
      - condition: and
        conditions:
          - condition: template
            value_template: "{{ sun_condition == 'night' }}"
          - condition: or
            conditions:
              - condition: sun
                after: sunset
                after_offset: !input sunset_offset
              - condition: sun
                before: sunrise
                before_offset: !input sunrise_offset

action:
  # First, turn off the override to ensure automatic control is active.
  - service: input_boolean.turn_off
    target:
      entity_id: !input manual_override_helper

  # Check if the light was manually turned off
  - choose:
      - conditions:
          - condition: template
            value_template: >
              {% set ns = namespace(last_context = this.context.id) %}
              {% for target_id in entity_target.entity_id %}
                {% if states[target_id].last_changed > this.attributes.last_triggered %}
                  {% if states[target_id].last_context.id != ns.last_context %}
                    {% set ns.last_context = states[target_id].last_context.id %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {{ ns.last_context != this.context.id }}
        sequence:
          # If the context is different, it means the light was changed manually.
          # Turn the override on and stop the automation.
          - service: input_boolean.turn_on
            target:
              entity_id: !input manual_override_helper
          - stop: "Manual control detected, stopping automation."
    default:
      # Turn on the lights.
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ use_custom_settings }}"
            sequence:
              - service: light.turn_on
                target: !input entity_target
                data:
                  brightness: !input brightness
                  rgb_color: !input color
              - service: switch.turn_on
                target: !input entity_target
        default:
          - service: light.turn_on
            target: !input entity_target

  # Wait for motion to stop.
  - wait_for_trigger:
      platform: state
      entity_id: !input motion_sensors
      to: "off"
  - delay: !input no_motion_wait

  # Before turning off, check if the light was manually controlled during the wait period.
  - choose:
      - conditions:
          - condition: template
            value_template: >
              {% set ns = namespace(last_context = this.context.id) %}
              {% for target_id in entity_target.entity_id %}
                {% if states[target_id].last_changed > this.attributes.last_triggered %}
                  {% if states[target_id].last_context.id != ns.last_context %}
                    {% set ns.last_context = states[target_id].last_context.id %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {{ ns.last_context != this.context.id }}
        sequence:
          # If the context is different, it means the light was changed manually.
          # Turn the override on and stop the automation.
          - service: input_boolean.turn_on
            target:
              entity_id: !input manual_override_helper
          - stop: "Manual control detected, stopping automation."
    default:
      - service: light.turn_off
        target: !input entity_target
