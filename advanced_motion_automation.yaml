blueprint:
  name: Motion-activated Light with Optional Luminance Check
  description: "Turn on lights when motion is detected if luminance is below a threshold. Optional: Night/day conditions, disable sensors, manual override."
  domain: automation
  input:
    motion_sensors:
      name: Motion and Occupancy Sensors
      description: Select one or more motion or occupancy sensors.
      selector:
        entity:
          domain: binary_sensor
          device_class:
            - motion
            - occupancy
          multiple: true
    entity_target:
      name: Lights and Switches
      description: Select one or more lights or switches to control.
      selector:
        target:
          entity:
            domain:
              - light
              - switch
    luminance_sensor:
      name: Luminance Sensor (Optional)
      description: Only turn on lights if luminance is below this threshold.
      default: ""
      selector:
        entity:
          domain: sensor
          device_class:
           - illuminance
    luminance_threshold:
      name: Luminance Threshold (lx)
      description: Lights will turn on only if luminance is below this value.
      default: 500
      selector:
        number:
          min: 0
          max: 10000
          unit_of_measurement: lx
    no_motion_wait:
      name: Wait Time
      description: Time to leave the light on after last motion is detected.
      default: 60
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
    use_custom_settings:
      name: Use Custom Brightness and Color
      description: Enable to use custom brightness and color settings.
      default: false
      selector:
        boolean: {}
    brightness:
      name: Brightness
      description: Set the brightness level (0-255).
      default: 255
      selector:
        number:
          min: 0
          max: 255
    color:
      name: Color
      description: Set the color (in RGB format).
      default: [255, 255, 255]
      selector:
        color_rgb: {}   # ✅ Correct syntax for blueprint RGB color
    sun_condition:
      name: Sun Condition (Optional)
      description: Select the sun condition to check.
      default: night
      selector:
        select:
          options:
            - none
            - day
            - night
    sunrise_offset:
      name: Sunrise Offset (Optional)
      description: Offset from sunrise in format 'HH:MM' (e.g., '01:00' or '-00:30')
      default: "01:00"
      selector:
        text: {}
    sunset_offset:
      name: Sunset Offset (Optional)
      description: Offset from sunset in format 'HH:MM' (e.g., '01:00' or '-00:30')
      default: "-01:00"
      selector:
        text: {}
    manual_override_helper:
      name: Manual Override Helper (Optional)
      description: Select an input_boolean helper to disable automation when turned on.
      default: ""
      selector:
        entity:
          domain: input_boolean
    disable_sensors:
      name: Optional Disable Sensors
      description: If any of these sensors are ON, automation is disabled.
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true

mode: restart
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input motion_sensors
    to: "on"
    id: motion_trigger

variables:
  use_custom_settings: !input use_custom_settings
  sun_condition: !input sun_condition
  sunrise_offset: !input sunrise_offset
  sunset_offset: !input sunset_offset
  manual_override_helper: !input manual_override_helper
  entity_target: !input entity_target
  disable_sensors: !input disable_sensors
  luminance_sensor: !input luminance_sensor
  luminance_threshold: !input luminance_threshold

condition:
  # 1 — Optional disable sensors
  - condition: template
    value_template: "{{ disable_sensors | length == 0 or disable_sensors | select('is_state', 'on') | list | length == 0 }}"
  # 2 — Optional manual override
  - condition: template
    value_template: "{{ manual_override_helper in [None, ''] or states(manual_override_helper) == 'off' }}"
  # 3 — Sun condition
  - condition: or
    conditions:
      - condition: template
        value_template: "{{ sun_condition == 'none' }}"
      - condition: and
        conditions:
          - condition: template
            value_template: "{{ sun_condition == 'day' }}"
          - condition: sun
            after: sunrise
            after_offset: !input sunrise_offset
            before: sunset
            before_offset: !input sunset_offset
      - condition: and
        conditions:
          - condition: template
            value_template: "{{ sun_condition == 'night' }}"
          - condition: or
            conditions:
              - condition: sun
                after: sunset
                after_offset: !input sunset_offset
              - condition: sun
                before: sunrise
                before_offset: !input sunrise_offset

action:
  # Turn on lights (optional luminance check + custom settings)
  - choose:
      - conditions:
          - condition: template
            value_template: >
              {% if luminance_sensor not in [None, ''] %}
                {% set lux = states(luminance_sensor) | float(0) %}
                {{ lux < luminance_threshold }}
              {% else %}
                true
              {% endif %}
        sequence:
          - service: light.turn_on
            target: !input entity_target
            data: >
              {% if use_custom_settings %}
              {
                "brightness": {{ brightness }},
                "rgb_color": {{ color }}
              }
              {% else %}
              {}
              {% endif %}

  # Wait for motion to stop
  - wait_for_trigger:
      platform: state
      entity_id: !input motion_sensors
      to: "off"
  - delay: !input no_motion_wait

  # Turn off lights (always)
  - service: light.turn_off
    target: !input entity_target
