blueprint:
  name: Smart Manual Override for Lights
  description: >
    Detects manual control of selected lights to activate a manual override helper.
    If the light is controlled manually again while the override is active, it will be deactivated.
    Only triggers on the light being toggled off and on, not on changes in brightness or light temperature or colour.
  domain: automation
  input:
    target_lights:
      name: Lights to Monitor
      description: Select one or more lights that this override should monitor.
      selector:
        entity:
          domain: light
          multiple: true
    manual_override_helper:
      name: Manual Override Helper
      description: The input_boolean that represents the manual override state.
      selector:
        entity:
          domain: input_boolean

mode: single

trigger:
  - platform: state
    entity_id: !input target_lights

variables:
  override_helper: !input manual_override_helper

action:
  - choose:
      # --- PATH 1: The change was MANUAL ---
      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.context.parent_id is none }}"
          - condition: template
            value_template: >
              {{ trigger.from_state.state != trigger.to_state.state }}
        sequence:
          - choose:
              # --- Sub-path 1a: Override is ON, so turn it OFF ---
              - conditions:
                  - condition: state
                    entity_id: !input manual_override_helper
                    state: "on"
                sequence:
                  - service: input_boolean.turn_off
                    target:
                      entity_id: !input manual_override_helper
            # --- Sub-path 1b: Override is OFF, so turn it ON ---
            default:
              - service: input_boolean.turn_on
                target:
                  entity_id: !input manual_override_helper
